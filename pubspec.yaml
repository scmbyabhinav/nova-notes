name: orah_notes
description: Orah — a fast, private, offline-first note-taking app.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  intl: ^0.20.3
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^13.3.0
  screenshot: ^3.0.0
  http: ^1.6.0
  pdf: ^3.11.3
  archive: ^4.0.7
  flutter_markdown_plus: ^1.0.12
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.15.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  in_app_purchase: ^3.3.1
  home_widget: ^0.10.0
  quick_actions: ^1.1.1
  speech_to_text: ^7.4.0
  receive_sharing_intent: 1.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/abhinav_bajpai_signature.png
