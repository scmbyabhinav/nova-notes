name: Orah Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_release:
        description: "Build a Play-uploadable AAB using the protected ORAH upload key"
        required: true
        type: boolean
        default: false

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Patch Orah Android host
        run: python3 tool/prepare_android_host.py

      - name: Verify Android target API 36+
        run: |
          python3 tool/verify_android_config.py --min-api 36

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  android-build:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Patch Orah Android host
        run: python3 tool/prepare_android_host.py

      - name: Verify Android target API 36+
        run: |
          python3 tool/verify_android_config.py --min-api 36

      - name: Get dependencies
        run: flutter pub get

      - name: Configure production signing
        if: ${{ inputs.production_release == true }}
        env:
          ORAH_UPLOAD_KEYSTORE_B64: ${{ secrets.ORAH_UPLOAD_KEYSTORE_B64 }}
          ORAH_KEYSTORE_PASSWORD: ${{ secrets.ORAH_KEYSTORE_PASSWORD }}
          ORAH_KEY_ALIAS: ${{ secrets.ORAH_KEY_ALIAS }}
          ORAH_KEY_PASSWORD: ${{ secrets.ORAH_KEY_PASSWORD }}
        run: python3 tool/configure_release_signing.py

      - name: Guard production release signing
        if: ${{ inputs.production_release == true }}
        run: python3 tool/verify_production_signing_config.py

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release AAB target API and signature
        run: python3 tool/verify_release_artifacts.py --aab build/app/outputs/bundle/release/app-release.aab --min-api 36 --require-production-signing ${{ inputs.production_release }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orah-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Cleanup signing material
        if: always() && inputs.production_release == true
        run: rm -f key.properties android/key.properties android/app/*.jks android/app/*.keystore *.jks *.keystore
