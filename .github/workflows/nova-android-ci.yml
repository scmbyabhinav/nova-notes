name: Orah Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate missing platform folders
        run: flutter create --platforms=android .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test

  android-build:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android .
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          old_android = """android {
    namespace = "com.example.orah_notes"
    compileSdk = flutter.compileSdkVersion
"""
          new_android = """android {
    namespace = "com.example.orah_notes"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        isCoreLibraryDesugaringEnabled = true
    }
"""
          if old_android not in text:
              raise SystemExit("Expected android/app/build.gradle.kts structure not found")
          text = text.replace(old_android, new_android, 1)

          old_dependencies = """dependencies {
"""
          new_dependencies = """dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
"""
          if old_dependencies not in text:
              text += "\n" + new_dependencies
          else:
              text = text.replace(old_dependencies, new_dependencies, 1)

          path.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Verify release artifacts
        run: |
          set -e
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          echo "Release APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          echo "Release AAB: $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orah-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

