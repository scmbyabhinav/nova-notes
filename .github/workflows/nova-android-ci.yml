name: Orah Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Flutter
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test

  android:
    name: Build Android artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.orah --project-name orah_notes .
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Enable Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("android/app/build.gradle.kts was not generated")
          s = p.read_text()
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = flutter.compileSdkVersion\n\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }",
                  1,
              )
          if "coreLibraryDesugaring(" not in s:
              s = s.replace(
                  "dependencies {",
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                  1,
              )
          p.write_text(s)
          PY
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Verify artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: orah-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
