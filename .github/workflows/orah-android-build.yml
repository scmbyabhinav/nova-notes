name: Orah Android Build

on:
  push:
    branches: [attack-125-ci-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android
        run: |
          flutter create --platforms=android --org com.orah --project-name orah_notes --no-pub .
          python3 tool/prepare_android_host.py
      - name: Dependencies
        run: flutter pub get
      - name: Align Android plugin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = list(Path.home().glob('.pub-cache/hosted/pub.dev/receive_sharing_intent-*'))
          if not roots:
              raise SystemExit('receive_sharing_intent package not found after pub get')
          for root in roots:
              for path in root.rglob('build.gradle*'):
                  text = path.read_text()
                  updated = text.replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')
                  if updated != text:
                      path.write_text(updated)
                      print(f'Patched {path}')
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Force Gradle JVM target alignment
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects { project ->
            project.tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
              options.release = 17
            }
            project.tasks.configureEach { task ->
              if (task.class.name.contains('KotlinCompile')) {
                try { task.kotlinOptions.jvmTarget = '17' } catch (ignored) {}
              }
            }
          }
          GRADLE
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orah-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
