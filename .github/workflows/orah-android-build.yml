name: Orah Android Build
# CI validation trigger: release/debug artifact gate

on:
  push:
    branches: [main, reconcile-main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_release:
        description: "Build a production-signed APK/AAB using configured GitHub secrets"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android
        run: |
          flutter create --platforms=android --org com.orah --project-name orah_notes --no-pub .
          python3 tool/prepare_android_host.py
      - name: Prepare supplied Orah launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check CairoSVG
          python3 tool/prepare_brand_assets.py
      - name: Dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Verify generated launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/app_icon.png
          mapfile -t icon_pngs < <(find android/app/src/main/res -type f -path '*/mipmap-*/*.png' -name '*.png' | sort)
          if [ "${#icon_pngs[@]}" -eq 0 ]; then
            echo "No generated launcher PNGs found under android/app/src/main/res/mipmap-*"
            exit 1
          fi
          printf 'Generated launcher PNGs:\n%s\n' "${icon_pngs[@]}"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if ! find "android/app/src/main/res/mipmap-${density}" -maxdepth 1 -type f -name 'ic_launcher.png' -size +0c -print -quit | grep -q .; then
              echo "Missing non-empty ic_launcher.png for mipmap-${density}"
              exit 1
            fi
          done
          echo "Launcher icon generation verified for all Android density buckets."
      - name: Verify Android desugaring configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("android/app")
          candidates = [app / "build.gradle.kts", app / "build.gradle"]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("android/app Gradle file not found")
          text = gradle.read_text()
          if gradle.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  if "compileOptions {" not in text:
                      raise SystemExit("compileOptions block not found")
                  text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "com.android.tools:desugar_jdk_libs" not in text:
                  dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", "dependencies {\n    " + dep, 1)
                  else:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"
          else:
              if "coreLibraryDesugaringEnabled true" not in text:
                  if "compileOptions {" not in text:
                      raise SystemExit("compileOptions block not found")
                  text = text.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "com.android.tools:desugar_jdk_libs" not in text:
                  dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", "dependencies {\n    " + dep, 1)
                  else:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"
          gradle.write_text(text)
          PY
      - name: Align Android plugin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = list(Path.home().glob('.pub-cache/hosted/pub.dev/*'))
          if not roots:
              raise SystemExit('pub.dev package cache not found after pub get')
          for root in roots:
              for path in root.rglob('build.gradle*'):
                  text = path.read_text()
                  updated = (text
                      .replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
                      .replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')
                      .replace("jvmTarget = '1.8'", "jvmTarget = '17'")
                      .replace('jvmTarget = "1.8"', 'jvmTarget = "17"'))
                  if updated != text:
                      path.write_text(updated)
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Configure Android JVM compatibility
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
            allprojects { project ->
              project.tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }
              project.tasks.configureEach { task ->
                if (task.class.name.contains('KotlinCompile')) {
                  try { task.kotlinOptions.jvmTarget = '17' } catch (ignored) {}
                }
              }
            }
          }
          GRADLE
      - name: Free runner disk before release builds
        run: |
          rm -rf build android/.gradle ~/.gradle/caches ~/.gradle/daemon
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake/* || true
          df -h /
      - name: Configure production signing
        if: ${{ inputs.production_release == true }}
        env:
          ORAH_UPLOAD_KEYSTORE_B64: ${{ secrets.ORAH_UPLOAD_KEYSTORE_B64 }}
          ORAH_KEYSTORE_PASSWORD: ${{ secrets.ORAH_KEYSTORE_PASSWORD }}
          ORAH_KEY_ALIAS: ${{ secrets.ORAH_KEY_ALIAS }}
          ORAH_KEY_PASSWORD: ${{ secrets.ORAH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORAH_UPLOAD_KEYSTORE_B64"
          test -n "$ORAH_KEYSTORE_PASSWORD"
          test -n "$ORAH_KEY_ALIAS"
          test -n "$ORAH_KEY_PASSWORD"
          printf '%s' "$ORAH_UPLOAD_KEYSTORE_B64" | base64 --decode > android/orah-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ORAH_KEYSTORE_PASSWORD
          keyPassword=$ORAH_KEY_PASSWORD
          keyAlias=$ORAH_KEY_ALIAS
          storeFile=orah-upload.jks
          EOF
      - name: Configure production signing in Gradle
        if: ${{ inputs.production_release == true }}
        run: python3 tool/configure_release_signing.py
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release --tree-shake-icons
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          unzip -t build/app/outputs/flutter-apk/app-release.apk >/dev/null
          unzip -t build/app/outputs/bundle/release/app-release.aab >/dev/null
          if [ "${{ inputs.production_release }}" = "true" ]; then
            apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk
            jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab >/tmp/orah-jarsigner.txt
            grep -q "jar verified" /tmp/orah-jarsigner.txt
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: orah-release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
